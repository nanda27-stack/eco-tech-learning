<!DOCTYPE html>
<html lang="id">
<head><title>Kuis Interaktif | Eco-Tech Learning</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { eco: { 50:'#effcf4',100:'#d8f8e4',500:'#22a45a',600:'#16834d',700:'#11633d',900:'#123b2b' } } } } }
</script>
<style>
  html { scroll-behavior:smooth }
  .float { animation: float 3s ease-in-out infinite }
  .fade-up { animation: fadeUp .8s ease both }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-emerald-100">
  <nav class="max-w-6xl mx-auto px-5 py-4 flex flex-wrap items-center justify-between gap-3">
    <a href="index.html" class="font-black text-xl text-eco-700">🌱 ECO-TECH</a>
    <button id="menuBtn" class="md:hidden px-3 py-2 rounded-lg bg-eco-50 text-eco-700" aria-label="Buka menu">☰</button>
    <div id="menu" class="hidden md:flex w-full md:w-auto flex-col md:flex-row gap-2 md:gap-5 text-sm font-semibold text-slate-700">
      <a class="hover:text-eco-600" href="index.html">Beranda</a>
      <a class="hover:text-eco-600" href="masalah-lingkungan.html">Masalah Lingkungan</a>
      <a class="hover:text-eco-600" href="teknologi-lingkungan.html">Teknologi</a>
      <a class="hover:text-eco-600" href="smart-environment.html">Smart Environment</a>
      <a class="hover:text-eco-600" href="solusi.html">Solusi</a>
      <a class="hover:text-eco-600" href="kuis.html">Kuis</a>
      <a class="hover:text-eco-600" href="penutup.html">Penutup</a>
    </div>
  </nav>
</header>
<script>
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('menu').classList.toggle('hidden'));
</script>


<main class="max-w-3xl mx-auto px-5 py-14">
 <p class="text-eco-600 font-bold">EVALUASI</p><h1 class="text-4xl font-black text-eco-900 mt-2">Kuis Teknologi Lingkungan</h1><p class="text-slate-600 mt-3">Pilih satu jawaban yang paling tepat untuk setiap pertanyaan.</p>
 <form id="quiz" class="space-y-5 mt-8">
  <div id="questions"></div>
  <button class="bg-eco-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-eco-700" type="submit">Periksa Jawaban</button>
  <button class="bg-slate-200 text-slate-700 font-bold px-6 py-3 rounded-xl" type="reset">Ulangi</button>
 </form>
 <div id="result" class="hidden mt-7 bg-eco-50 border border-emerald-200 p-6 rounded-2xl" aria-live="polite"></div>
</main>
<script>
const questions = [
 {q:"Apa tujuan utama teknologi lingkungan?",a:["Mempercepat kerusakan alam","Mengurangi dan mengatasi masalah lingkungan","Menambah penggunaan sumber daya"],c:1},
 {q:"Panel surya memanfaatkan energi dari ...",a:["Matahari","Batu bara","Minyak bumi"],c:0},
 {q:"Apa fungsi sensor kelembapan tanah?",a:["Mengukur suara","Membaca kelembapan tanah","Mengukur kecepatan angin"],c:1},
 {q:"Recycle berarti ...",a:["Membuang barang","Membakar sampah","Mendaur ulang"],c:2},
 {q:"Apa manfaat penyiraman otomatis?",a:["Membantu efisiensi penggunaan air","Membuat tanah selalu tergenang","Menghilangkan kebutuhan merawat tanaman"],c:0}
];
const holder=document.getElementById('questions');
function render(){
 holder.innerHTML=questions.map((q,i)=>`<fieldset class="bg-white rounded-2xl p-5 shadow-sm"><legend class="font-bold text-lg">${i+1}. ${q.q}</legend><div class="mt-3 space-y-2">${q.a.map((a,j)=>`<label class="flex gap-3 items-center p-2 rounded-lg hover:bg-eco-50"><input required type="radio" name="q${i}" value="${j}" class="accent-emerald-600">${a}</label>`).join('')}</div></fieldset>`).join('');
}
render();
document.getElementById('quiz').addEventListener('submit',e=>{
 e.preventDefault();let score=0;
 questions.forEach((q,i)=>{if(Number(new FormData(e.target).get('q'+i))===q.c)score++});
 const box=document.getElementById('result');box.classList.remove('hidden');
 box.innerHTML=`<h2 class="text-2xl font-black text-eco-900">Nilai kamu: ${score*20}/100</h2><p class="mt-2">${score===5?'Hebat! Semua jawaban benar. 🎉':score>=3?'Bagus! Pelajari kembali materi yang belum dikuasai.':'Jangan menyerah. Baca kembali materi lalu coba lagi.'}</p><p class="text-sm mt-2">Jawaban benar: ${score} dari ${questions.length} soal.</p>`;
 box.scrollIntoView({behavior:'smooth'});
});
document.getElementById('quiz').addEventListener('reset',()=>{const box=document.getElementById('result');box.classList.add('hidden');box.innerHTML='';});
</script>


<footer class="bg-eco-900 text-emerald-50 mt-16">
 <div class="max-w-6xl mx-auto px-5 py-8 text-center">
  <p class="font-bold">ECO-TECH LEARNING</p>
  <p class="text-sm text-emerald-100 mt-2">Belajar teknologi, menjaga bumi.</p>
  <p class="text-xs text-emerald-200 mt-4">Media Pembelajaran Teknologi Lingkungan</p>
 </div>
</footer>

</body></html>
